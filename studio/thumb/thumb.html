<!doctype html><html><head><meta charset="utf-8"><style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:1280px;height:720px;overflow:hidden;background:#050506;font-family:"Inter Display","Inter",sans-serif;color:#f4f4f5;position:relative}
.glow{position:absolute;inset:0;background:radial-gradient(ellipse 620px 480px at 28% 55%,rgba(255,59,59,.22),transparent 70%),radial-gradient(ellipse 600px 420px at 80% 40%,rgba(245,184,0,.16),transparent 70%)}
.grid{position:absolute;inset:0;opacity:.07;background-image:linear-gradient(#f5b800 1px,transparent 1px),linear-gradient(90deg,#f5b800 1px,transparent 1px);background-size:80px 80px}
.vig{position:absolute;inset:0;background:radial-gradient(ellipse at center,transparent 50%,rgba(0,0,0,.8) 100%)}
.left{position:absolute;left:70px;top:120px;width:560px;text-align:center}
.tag{display:inline-block;background:#ff3b3b;color:#fff;font-weight:800;font-size:30px;letter-spacing:.2em;padding:12px 24px;border-radius:10px}
.score{font-weight:900;font-size:300px;line-height:1;color:#ff3b3b;text-shadow:0 0 60px rgba(255,59,59,.6);margin-top:10px;white-space:nowrap}
.sub{font-weight:800;font-size:38px;margin-top:6px;color:#e8e8ea}
.right{position:absolute;right:50px;top:175px;width:600px;text-align:center}
.big{font-weight:900;font-size:116px;white-space:nowrap;line-height:.95;color:#f5b800;text-shadow:0 6px 0 #000,0 0 50px rgba(245,184,0,.45)}
.small{font-weight:900;font-size:56px;line-height:1;margin-top:30px}
.brand{position:absolute;bottom:34px;left:0;right:0;text-align:center;font-weight:800;letter-spacing:.3em;font-size:26px;color:#8f8f99}
.brand b{color:#f5b800}
</style></head><body><div class="glow"></div><div class="grid"></div><div class="vig"></div>
<div class="left"><span class="tag">LAOS – BIRMANIE</span><div class="score">7-2</div><div class="sub">2 CSC · 3 CARTONS ROUGES</div></div>
<div class="right"><div class="big">MATCH<br>TRUQUÉ ?</div><div class="small">La police enquête</div></div>
<div class="brand">ODDS <b>HUNTER</b></div></body></html>
