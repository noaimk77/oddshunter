<script>

  ["s12", "Il faudra attendre plus de dix ans pour que steel et swag"],

  ["s12", "Et un match que plus personne n'a oublié."],

  ["s13", "La prochaine affaire arrive bientôt."],
];
const CPS = 14.5, GAP = 0.35, SCENE_GAP = 0.45, LEAD = 0.8, TAIL = 4;
const spokenLen = (t) => t.replace(/\b(19|20)\d\d\b/g, "x".repeat(18)).replace(/\d+[  ]000/g, "x".repeat(10)).replace(/\d+/g, "x".repeat(6)).length;
const PH = [], SCENES = [];
{
  let cur = LEAD, prev = null;
  for (const [sc, text] of CAPS) {
    if (sc !== prev) { if (prev) cur += SCENE_GAP; SCENES.push([sc, Math.max(0, cur - 0.35), 0]); prev = sc; }
    const words = text.replace(/ ([?:!»])/g, " $1").replace(/« /g, "« ").split(" ");
    const wts = words.map((w) => /\d/.test(w) ? Math.max(w.length, 6) : w.length + 1);
    const tot = wts.reduce((a, b) => a + b, 0), dur = Math.max(1.2, spokenLen(text) / CPS);
    let acc = 0; const wt = wts.map((x) => { const s = cur + dur * acc / tot; acc += x; return s; });
    PH.push({ sc, text, words, wt, a: cur, b: cur + dur });
    cur += dur + GAP;
  }
  SCENES[0][1] = 0;
}
const DURATION = PH[PH.length - 1].b + TAIL;
SCENES.forEach((s, i) => { s[2] = i < SCENES.length - 1 ? SCENES[i + 1][1] : DURATION; });
const CUTS = SCENES.slice(1).map((s) => s[1]);
// Phrase lookup by text prefix (first match), then word times inside it.
const Q = (prefix) => { const i = PH.findIndex((p) => p.text.startsWith(prefix)); if (i < 0) throw new Error("phrase " + prefix); return PH[i]; };
const P = (prefix) => Q(prefix).a, E = (prefix) => Q(prefix).b;
const W = (prefix, w) => { const p = Q(prefix), k = p.words.findIndex((x) => x.toLowerCase().startsWith(w.toLowerCase())); if (k < 0) throw new Error(`cue ${prefix} ${w}`); return p.wt[k]; };
const S = (id) => SCENES.find((s) => s[0] === id)[1];
const HITS = [P("16 à 4."), W("Et là, il se passe", "marcher"), W("Résultat : sept", "sept"), P("Dix ans de carrière")];
window.TIMING = { DURATION, SCENES, CUTS, HITS, PH: PH.map(({ text, a, b }) => ({ text, a, b })) };

const $ = (id) => document.getElementById(id);
const clamp = (x, a=0, b=1) => Math.max(a, Math.min(b, x));
const ease = (x) => { x = clamp(x); return 1 - Math.pow(1 - x, 3); };
const inout = (x) => { x = clamp(x); return x < .5 ? 4*x*x*x : 1 - Math.pow(-2*x + 2, 3) / 2; };
const back = (x) => { x = clamp(x); const c1 = 1.9, c3 = c1 + 1; return 1 + c3*Math.pow(x-1,3) + c1*Math.pow(x-1,2); };
function rise(id, t, at, dur=0.45, dy=50) {
  const p = ease((t - at) / dur), el = $(id);
  el.style.opacity = p; el.style.transform = `translateY(${(1-p)*dy}px)`; el.style.filter = `blur(${(1-p)*10}px)`;
}
function slam(id, t, at, dur=0.4) {
  const p = clamp((t - at) / dur), el = $(id);
  el.style.opacity = ease(p * 2); el.style.transform = `scale(${2.2 - 1.2*ease(p)})`; el.style.filter = `blur(${(1-ease(p))*14}px)`;
}
function pop(id, t, at, dur=0.5) {
  const p = clamp((t - at) / dur), el = $(id);
  el.style.opacity = ease(p * 1.8); el.style.transform = `scale(${p === 0 ? .6 : .6 + .4*back(p)})`;
}
let shake = 0, red = 0;
const impact = (t, at, amp=14) => { const d = t - at; if (d >= 0 && d < 0.35) shake = Math.max(shake, (1 - d/0.35) * amp); };
const redHit = (t, at) => { if (t > at && t < at + 0.4) red = Math.max(red, 0.2 * (1 - (t - at) / 0.4)); };

let shownPh = -2;
function renderSubs(t) {
  let idx = -1;
  for (let i = 0; i < PH.length; i++) if (t >= PH[i].a - 0.05) idx = i;
  if (idx === PH.length - 1 && t > PH[idx].b + 1.2) idx = -1;
  const subs = $("subs");
  if (idx !== shownPh) { subs.innerHTML = idx < 0 ? "" : PH[idx].words.map((w) => `<span>${w}</span>`).join(" "); shownPh = idx; }
  if (idx < 0) { subs.style.opacity = 0; return; }
  const p = PH[idx];
  [...subs.children].forEach((el, k) => {
    const end = k + 1 < p.wt.length ? p.wt[k + 1] : p.b;
    el.className = t >= end ? "said" : t >= p.wt[k] ? "now" : "next";
  });
  const q = ease((t - p.a + 0.05) / 0.15);
  subs.style.opacity = q; subs.style.transform = `translateY(${(1-q)*14}px)`;
}

window.render = function (t) {
  shake = 0; red = 0;
  $("progress").style.width = (t / DURATION * 100) + "%";
  for (const [id, a, b] of SCENES) {
    const vis = (t >= a && t < b) ? Math.min(ease((t - a) / 0.25), id === "s13" ? 1 : 1 - ease((t - (b - 0.25)) / 0.25)) : 0;
    $(id).style.opacity = vis;
  }
  let fl = 0; for (const c of CUTS) { const d = t - c; if (d >= -0.05 && d < 0.25) fl = Math.max(fl, 1 - Math.abs(d + 0.05) / 0.3); }
  $("flash").style.opacity = fl * 0.4;
  const cur = SCENES.find(([, a, b]) => t >= a && t < b) || SCENES[SCENES.length - 1];
  let camScale = 1 + 0.04 * inout((t - cur[1]) / (cur[2] - cur[1]));

  // S1
  slam("s1n", t, P("16 à 4.") - 0.1); impact(t, P("16 à 4.") + 0.15, 18); redHit(t, P("16 à 4.") + 0.15);
  rise("s1a", t, W("des milliers de dollars", "sept"));
  // S2
  rise("s2tag", t, S("s2") + 0.1); slam("s2t", t, W("Et en Amérique du Nord", "iBUYPOWER")); impact(t, W("Et en Amérique du Nord", "iBUYPOWER") + 0.2);
  ["DaZeD", "swag", "steel", "AZK", "Skadoodle"].forEach((n, i) => pop("s2p" + (i + 1), t, W("Des joueurs comme", n)));
  // S3
  rise("s3tag", t, S("s3") + 0.1);
  pop("s3a", t, W("Certaines valent", "centimes")); pop("s3b", t, W("Certaines valent", "centaines")); pop("s3c", t, W("Certaines valent", "milliers"));
  rise("s3x1", t, W("Pas de pièce", "pièce")); rise("s3x2", t, W("Pas de pièce", "d'âge")); rise("s3x3", t, W("Pas d'argent liquide", "bookmaker"));
  // S4
  rise("s4tag", t, S("s4") + 0.1); rise("s4board", t, P("Le 20 août 2014"));
  pop("s4fav", t, P("iBUYPOWER est grand favori"));
  { const a = P("Et là, il se passe"), b = PH.filter((p) => p.text === "16 à 4.")[1].a + 0.2, k = inout((t - a) / (b - a));
    $("s4l").textContent = Math.round(4 * k); $("s4r").textContent = Math.round(16 * k); impact(t, b, 18); redHit(t, b); }
  rise("s4z", t, P("des rounds lâchés"));
  // S5
  slam("s5a", t, S("s5") + 0.1); impact(t, S("s5") + 0.3, 10); rise("s5b", t, P("Le 16 janvier 2015"));
  // S6
  rise("s6tag", t, S("s6") + 0.1); rise("s6flow", t, W("Avec l'aide", "mises"));
  pop("s6m1", t, W("Les chiffres qui sortent", "10")); impact(t, W("Les chiffres qui sortent", "10") + 0.2, 10);
  pop("s6m2", t, W("et autour de", "7")); impact(t, W("et autour de", "7") + 0.2, 10);
  // S7
  rise("s7tag", t, S("s7") + 0.1); rise("s7q", t, P("Dans son communiqué"));
  ["DaZeD", "swag", "AZK", "steel"].forEach((n, i) => pop("s7n" + (i + 1), t, W("Les quatre joueurs", n)));
  pop("s7n5", t, W("Duc", "Pham")); pop("s7n6", t, W("Duc", "Boorn")); pop("s7n7", t, W("Duc", "Foster"));
  impact(t, W("Résultat : sept", "sept") + 0.2, 16); redHit(t, W("Résultat : sept", "sept") + 0.2);
  rise("s7s", t, P("Skadoodle, lui"));
  // S8
  slam("s8a", t, S("s8") + 0.1); impact(t, S("s8") + 0.3, 10);
  pop("s8b1", t, W("CEVO, la ligue", "CEVO")); pop("s8b2", t, W("CEVO, la ligue", "FACEIT")); pop("s8b3", t, W("CEVO, la ligue", "ESEA"));
  // S9
  rise("s9tag", t, P("En janvier 2018")); slam("s9a", t, P("Cloud9, au Major")); impact(t, P("Cloud9, au Major") + 0.2);
  rise("s9b", t, W("Et dans l'équipe", "Skadoodle")); rise("s9c", t, P("et si les autres"));
  // S10
  rise("s10tag", t, S("s10") + 0.1);
  pop("s10a", t, P("Un, le volume")); pop("s10b", t, P("Deux, le sens")); pop("s10c", t, P("Trois, les comptes"));
  rise("s10z", t, P("Parce que ce qui a fait tomber"));
  // S11

  // S12
  pop("s12a", t, W("Et la fin de l'histoire", "ESL")); pop("s12b", t, W("Et la fin de l'histoire", "DreamHack")); pop("s12c", t, P("Il faudra attendre"));
  slam("s12z", t, P("Dix ans de carrière")); impact(t, P("Dix ans de carrière") + 0.2, 18); redHit(t, P("Dix ans de carrière") + 0.2);
  // S13
  pop("s13logo", t, S("s13") + 0.2, 0.6); pop("s13cta", t, W("Si ce genre", "abonne")); rise("s13foot", t, E("La prochaine affaire") + 0.3, 0.4, 20);
