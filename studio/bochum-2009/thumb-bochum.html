<!doctype html><html><head><meta charset="utf-8"><style>
*{margin:0;padding:0;box-sizing:border-box}
/* text layer only (no person photo in this story): centred over a darkened football frame */
body{width:1280px;height:720px;overflow:hidden;background:transparent;font-family:"Inter Display","Inter",sans-serif;color:#f4f4f5;position:relative}

.mid{position:absolute;left:0;right:0;top:120px;text-align:center}
.tag{display:inline-block;background:#ff3b3b;color:#fff;font-weight:800;font-size:30px;letter-spacing:.16em;padding:12px 24px;border-radius:10px}
.big{font-weight:900;font-size:104px;line-height:.95;color:#f5b800;margin-top:26px;text-shadow:0 6px 0 #000,0 0 40px rgba(0,0,0,.8)}
.score{font-weight:900;font-size:62px;line-height:1;margin-top:30px;color:#fff;text-shadow:0 4px 0 #000,0 0 30px rgba(0,0,0,.9)}
.score span{color:#ff3b3b}
.brand{position:absolute;bottom:30px;left:0;right:0;text-align:center;font-weight:800;letter-spacing:.3em;font-size:24px;color:rgba(255,255,255,.8);text-shadow:0 2px 8px #000}
.brand b{color:#f5b800}
</style></head><body><div class="shade"></div>
<div class="mid"><span class="tag">FOOT · MATCHS TRUQUÉS</span><div class="big">200 MATCHS<br>TRUQUÉS ?</div><div class="score">LE MÊME HOMME, <span>DEUX FOIS</span></div></div>
